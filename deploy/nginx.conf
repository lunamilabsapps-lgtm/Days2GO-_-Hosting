# Alternative to Caddy if you prefer nginx + certbot. Replace scout.brightcoda.com with your domain.
server {
    listen 80;
    server_name scout.brightcoda.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name scout.brightcoda.com;
    ssl_certificate /etc/letsencrypt/live/scout.brightcoda.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scout.brightcoda.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/stream {
        proxy_pass http://api:8001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
    location /api/ {
        proxy_pass http://api:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }
    location / {
        proxy_pass http://frontend:80;
    }
}
